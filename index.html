<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>idk Plus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 65%, #030712 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }

        .card {
            width: 100%;
            max-width: 390px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 34px 24px 28px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* توهج خلفي في رأس الكارد */
        .card::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, transparent 70%);
            filter: blur(30px);
            z-index: 0;
            pointer-events: none;
        }

        .avatar-wrap {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 16px;
            z-index: 1;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .pulse-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid #6366f1;
            opacity: 0.6;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.96); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.2; }
            100% { transform: scale(0.96); opacity: 0.8; }
        }

        .app-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            z-index: 1;
            position: relative;
        }

        .shield-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            z-index: 1;
            position: relative;
        }

        .shield-badge span {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .msg {
            font-size: 15px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 24px;
            z-index: 1;
            position: relative;
        }

        .dev-handle {
            color: #818cf8;
            font-weight: 700;
            direction: ltr;
            display: inline-block;
        }

        /* حاوية الأزرار */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1;
            position: relative;
        }

        .btn-vip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.45);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-vip:active {
            transform: scale(0.98);
            box-shadow: 0 5px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-channel {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px;
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        .btn-channel:active {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الصورة الدائرية مع تأثير النبض المتوهج -->
        <div class="avatar-wrap">
            <div class="pulse-ring"></div>
            <img class="avatar" src="https://i.postimg.cc/BbB0B26r/0D628648-53E6-4D07-8AA4-9DAC71CD25D5.jpg" alt="Developer Logo">
        </div>

        <h1 class="app-name">idk Plus</h1>
        
        <div class="shield-badge">
            <span></span>
            وضع الحماية مفعل (Anti-Revoke)
        </div>

        <p class="msg">
            أهلاً بك في وضع حماية شهادة المطور <span class="dev-tag dev-handle">@x_arw</span>.<br>
            استمتع بالتطبيقات وتخطي قيود الإلغاء بكل سلاسة.
        </p>

        <!-- الأزرار التفاعلية -->
        <div class="actions">
            <!-- زر شراء الشهادة السنوية -->
            <a class="btn-vip" href="https://t.me/x_arw">
                ⚡ لشراء شهادة سنوية اضغط هنا
            </a>

            <!-- زر دعم إضافي للمجتمع أو القناة -->
            <a class="btn-channel" href="https://t.me/xar_ipa">
                زيارة قناة التيليجرام الرسمية
            </a>
        </div>
    </div>

</body>
</html>
